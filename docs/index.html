<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5dc"><title>歌う顔写真 ～音波フライト～</title><link rel="stylesheet" href="style.css"></head><body><main><div id="stage"><canvas id="game" width="1100" height="650" tabindex="0" aria-label="歌う顔写真。Spaceで開始、Pで写真選択、Aで顔の調整"></canvas><video id="camera" autoplay playsinline muted hidden></video><div id="busy" hidden><p id="busyText" role="status">顔と髪を切り抜いています…</p></div></div><div id="touch"><button id="sing">SPACE / 長押しして離す</button><label>低・前 <input id="pitch" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="角度と音程"> 高・上</label><button id="back">タイトル (Esc)</button><button id="mute" aria-pressed="false">音：ON</button></div><p id="status" role="status">写真は端末内で処理・保存します。写真を選ぶとMediaPipeで顔と髪を自動切り抜きします。</p><input id="files" type="file" accept="image/*" multiple hidden><noscript>このゲームにはJavaScriptが必要です。</noscript></main><script type="module" src="app.js"></script></body></html>
